# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "pipeline-dev" ]
  pull_request:
    branches: [ "pipeline-dev" ]
  schedule:
    - cron: '0 8 * * 1-5'

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Set Playwright Install Path
        run: echo "PW_CACHE_PATH=$HOME/.cache/ms-playwright" >> $GITHUB_ENV
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ${{ env.PW_CACHE_PATH }}
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-
      - name: Install Playwright Dependencies
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.PW_CACHE_PATH }}
      - name: Build with Maven
        run: mvn -B verify --file pom.xml
